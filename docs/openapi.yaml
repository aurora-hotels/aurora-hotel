components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: aurora_session
      description: Sesja użytkownika; HttpOnly. Swagger nie wpisuje cookie ręcznie — użyj logowania.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Z /auth/csrf, aktualizowany po logowaniu/rejestracji/zmianie hasła.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      description: Alternatywny sposób przesłania tego samego klucza partnera.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: 'Ten sam klucz i body odtwarzają wcześniejszy wynik; różna treść daje 409. Zakres: użytkownik/partner.'
  responses:
    Error:
      description: Błąd; kod i czytelny opis w error. W razie 429 odczekaj Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties: true
          required:
            - code
            - message
            - fields
      required:
        - error
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
        - csrfToken
    User:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          maxLength: 30
          pattern: ^[+\d\s()-]*$
          default: ''
        role:
          type: string
          enum:
            - client
            - receptionist
            - admin
        active:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 ze strefą czasową, np. 2027-06-15T15:00:00+02:00.
      required:
        - id
        - email
        - name
        - phone
        - role
        - active
        - mustChangePassword
        - createdAt
    AuthenticatedUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - $ref: '#/components/schemas/CsrfToken'
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
          description: Domyślnie minimum 10 znaków; operator może zmienić PASSWORD_MIN_LENGTH.
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          maxLength: 30
          pattern: ^[+\d\s()-]*$
          default: ''
      required:
        - email
        - password
        - name
      additionalProperties: false
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
      required:
        - email
