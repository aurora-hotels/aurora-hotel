components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: aurora_session
      description: Cookie sesji z flagą HttpOnly. Zaloguj się przez aplikację lub endpoint logowania; przeglądarka dołączy cookie do żądań Swaggera.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token z /auth/csrf. Po logowaniu, rejestracji lub zmianie hasła używaj nowego tokenu z odpowiedzi.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      description: Alternatywny sposób przesłania tego samego klucza partnera.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: Ten sam klucz i treść żądania zwracają wynik wcześniejszej rezerwacji. Użycie klucza z inną treścią zwraca 409. Klucze są przypisane do użytkownika lub partnera.
  responses:
    Error:
      description: Pole error zawiera kod i opis błędu. Przy odpowiedzi 429 odczekaj liczbę sekund podaną w nagłówku Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties: true
          required:
            - code
            - message
            - fields
      required:
        - error
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
        - csrfToken
    User:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          maxLength: 30
          pattern: ^[+\d\s()-]*$
          default: ''
        role:
          type: string
          enum:
            - client
            - receptionist
            - admin
        active:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 ze strefą czasową, np. 2027-06-15T15:00:00+02:00.
      required:
        - id
        - email
        - name
        - phone
        - role
        - active
        - mustChangePassword
        - createdAt
    AuthenticatedUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - $ref: '#/components/schemas/CsrfToken'
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
          description: Domyślnie minimum 10 znaków; operator może zmienić PASSWORD_MIN_LENGTH.
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          maxLength: 30
          pattern: ^[+\d\s()-]*$
          default: ''
      required:
        - email
        - password
        - name
      additionalProperties: false
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
      required:
        - email
        - password
      additionalProperties: false
    ProfilePatch:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          maxLength: 30
          pattern: ^[+\d\s()-]*$
          default: ''
      minProperties: 1
      additionalProperties: false
    PasswordChange:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
          description: Domyślnie minimum 10 znaków; operator może zmienić PASSWORD_MIN_LENGTH.
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
    Guest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
