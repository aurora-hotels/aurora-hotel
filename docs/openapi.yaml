# API hotelu. Dane w przykładach służą do testów.
openapi: 3.0.3
info:
  title: API Aurora Hotels
  version: 1.0.0
  description:
    API do rezerwacji pokoi, obsługi pobytu i połączeń z projektami A, B i D. Ceny podajemy w groszach PLN,
    jako liczby całkowite. Klient i partner widzą swoje rezerwacje, a recepcja i administrator wszystkie.
    Przy zapisie przez sesję wymagamy tokenu CSRF. Partner podaje klucz API bez cookie sesji.
    Żądania z nieznanymi polami są odrzucane. Ustalenia dotyczące API innych grup są w Confluence
    (https://zielinskiadis.atlassian.net/wiki/spaces/KAN). Format tych połączeń wymaga jeszcze wspólnego uzgodnienia.
servers:
  - url: http://localhost:3001/api/v1
    description: Adres lokalny. Adres do połączenia z innymi grupami ustalamy przed wspólnym testem.
tags:
  - name: Konto
  - name: Oferta
  - name: Pobyty
  - name: Recepcja
  - name: Integracje
  - name: Administracja
  - name: Techniczne
paths:
  /auth/csrf:
    get:
      summary: Pobierz token CSRF
      operationId: getAuthCsrf
      tags:
        - Konto
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      description: Jeśli nie ma jeszcze sesji, tworzy ją i ustawia cookie. Cookie i zwrócony token będą potrzebne przy logowaniu lub rejestracji.
  /auth/register:
    post:
      summary: Załóż konto klienta
      operationId: postAuthRegister
      tags:
        - Konto
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      description: Najpierw pobierz cookie i token z /auth/csrf. Po rejestracji dostaniesz nową sesję i nowy csrfToken.
  /auth/login:
    post:
      summary: Zaloguj się
      operationId: postAuthLogin
      tags:
        - Konto
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      description: Wymaga tokenu z /auth/csrf. Po zalogowaniu zmienia identyfikator sesji i zwraca nowy token CSRF.
  /auth/logout:
    post:
      summary: Wyloguj się
      operationId: postAuthLogout
      tags:
        - Konto
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '204':
          description: Bez treści
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /me:
    get:
      summary: Pobierz swój profil
      operationId: getMe
      tags:
        - Konto
      security:
        - CookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    patch:
      summary: Zmień dane profilu
      operationId: patchMe
      tags:
        - Konto
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
  /me/change-password:
    post:
      summary: Zmień hasło i zakończ poprzednie sesje
      operationId: postMeChangePassword
      tags:
        - Konto
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
  /rooms:
    get:
      summary: Pokaż pokoje w ofercie
      operationId: getRooms
      tags:
        - Oferta
      security:
        - {}
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                required:
                  - items
                  - total
                  - page
                  - pageSize
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      description: Lista jest publiczna. Jeśli podajesz klucz API, musi być poprawny i mieć uprawnienie catalog:read.
  /packages:
    get:
      summary: Pokaż pakiety w ofercie
      operationId: getPackages
      tags:
        - Oferta
      security:
        - {}
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Package'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                required:
                  - items
                  - total
                  - page
                  - pageSize
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      description: Lista jest publiczna. Jeśli podajesz klucz API, musi być poprawny i mieć uprawnienie catalog:read.
  /availability:
    get:
      summary: Sprawdź wolne pokoje i cenę
      operationId: getAvailability
      tags:
        - Oferta
      security:
        - {}
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvailableRoom'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                required:
                  - items
                  - total
                  - page
                  - pageSize
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - name: checkIn
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: checkOut
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: guests
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 30
        - name: packageId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      description: Pokój zajmuje się od dnia przyjazdu do dnia poprzedzającego wyjazd. Klucz partnera musi mieć uprawnienie catalog:read.
  /reservations:
    post:
      summary: Zarezerwuj pobyt
      operationId: postReservations
      tags:
        - Pobyty
      security:
        - CookieAuth: []
          CsrfToken: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '200':
          description: Wynik wcześniejszej rezerwacji z tym samym kluczem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                  - 'true'
              description: Odpowiedź z wcześniejszego zapisu.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
            example:
              roomId: room-101
              checkIn: '2027-06-15'
              checkOut: '2027-06-17'
              guests: 1
              expectedTotalMinor: 48000
              guest:
                name: Anna Testowa
                email: anna@example.com
                phone: ''
              guestNames:
                - Anna Testowa
      x-required-scope: reservations:create
    get:
      summary: Pokaż rezerwacje
      operationId: getReservations
      tags:
        - Pobyty
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                required:
                  - items
                  - total
                  - page
                  - pageSize
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - confirmed
              - checked_in
              - completed
              - cancelled
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      description: Klient i partner widzą swoje rezerwacje, a recepcja i administrator wszystkie. Pole search szuka po numerze rezerwacji lub danych gościa.
      x-required-scope: reservations:read
  /reservations/{id}:
    get:
      summary: Pobierz szczegóły rezerwacji
      operationId: getReservationsId
      tags:
        - Pobyty
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      x-required-scope: reservations:read
    patch:
      summary: Zmień daty i liczbę gości
      operationId: patchReservationsId
      tags:
        - Pobyty
      security:
        - CookieAuth: []
          CsrfToken: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationPatch'
      x-required-scope: reservations:update
  /reservations/{id}/cancel:
    post:
      summary: Anuluj rezerwację pobytu
      operationId: postReservationsIdCancel
      tags:
        - Pobyty
      security:
        - CookieAuth: []
          CsrfToken: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
      description:
        Najpierw anuluje zamówione usługi A/B, potem pobyt. Jeśli usługa została już wykonana albo jej wynik
        jest nieznany, rezerwacja pobytu pozostaje aktywna. Można ponowić to samo żądanie anulowania.
      x-required-scope: reservations:cancel
  /reservations/{id}/check-in:
    post:
      summary: Zamelduj gościa
      operationId: postReservationsIdCheckIn
      tags:
        - Recepcja
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
      x-required-roles:
        - admin
        - receptionist
  /reservations/{id}/check-out:
    post:
      summary: Zakończ pobyt i potwierdź nocleg w D
      operationId: postReservationsIdCheckOut
      tags:
        - Recepcja
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckedOutReservation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
      x-required-roles:
        - admin
        - receptionist
  /reservations/{id}/guests:
    patch:
      summary: Popraw listę gości i dane kontaktowe
      operationId: patchReservationsIdGuests
      tags:
        - Recepcja
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationGuestsPatch'
      x-required-roles:
        - admin
        - receptionist
  /reservations/{id}/plan:
    get:
      summary: Pokaż usługi w planie pobytu
      operationId: getReservationsIdPlan
      tags:
        - Integracje
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
