# Kontrakt API C. Przykładowe daty i dane są fikcyjne.
openapi: 3.0.3
info:
  title: Aurora Hotels — API projektu C
  version: 1.0.0
  description:
    Hotel, pobyty, plan A/B i część hotelowa vouchera D. Kwoty są całkowitymi groszami PLN. Klient/partner
    widzi własne pobyty; recepcja/admin wszystkie. Sesja wymaga CSRF przy zapisie; partner używa jednego klucza
    bez cookie. Nieznane pola zapisu są odrzucane. Kontrakt A/B/D wychodzący opisano osobno w docs/integracje.md
    i wymaga uzgodnienia z grupami.
servers:
  - url: http://localhost:3001/api/v1
    description: Środowisko lokalne; wspólny adres ustalamy przy integracji.
tags:
  - name: Konto
  - name: Oferta
  - name: Pobyty
  - name: Recepcja
  - name: Integracje
  - name: Administracja
  - name: Techniczne
paths:
  /auth/csrf:
    get:
      summary: Utwórz/odczytaj token CSRF
      operationId: getAuthCsrf
      tags:
        - Konto
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      description: Ustawia cookie anonimowej sesji, jeżeli nie istnieje. Zachowaj je i token przed logowaniem/rejestracją.
  /auth/register:
    post:
      summary: Załóż konto klienta
      operationId: postAuthRegister
      tags:
        - Konto
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      description: Wymaga anonimowej sesji i jej tokenu CSRF. Tworzy nową sesję i zwraca nowy csrfToken.
  /auth/login:
    post:
      summary: Zaloguj się
      operationId: postAuthLogin
      tags:
        - Konto
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      description: Wymaga tokenu z /auth/csrf. W odpowiedzi nowy token po rotacji sesji.
  /auth/logout:
    post:
      summary: Wyloguj sesję
      operationId: postAuthLogout
      tags:
        - Konto
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '204':
          description: Bez treści
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /me:
    get:
      summary: Pobierz własny profil
      operationId: getMe
      tags:
        - Konto
      security:
        - CookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    patch:
      summary: Zmień własny profil
      operationId: patchMe
      tags:
        - Konto
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
  /me/change-password:
    post:
      summary: Zmień hasło i unieważnij stare sesje
      operationId: postMeChangePassword
      tags:
        - Konto
      security:
        - CookieAuth: []
          CsrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
  /rooms:
    get:
      summary: 'Lista aktywnej oferty: rooms'
      operationId: getRooms
      tags:
        - Oferta
      security:
        - {}
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                required:
                  - items
                  - total
                  - page
                  - pageSize
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      description: Bez uwierzytelnienia lub klucz z catalog:read. Podany błędny klucz nie jest pomijany.
  /packages:
    get:
      summary: 'Lista aktywnej oferty: packages'
      operationId: getPackages
      tags:
        - Oferta
      security:
        - {}
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Package'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                required:
                  - items
                  - total
                  - page
                  - pageSize
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      description: Bez uwierzytelnienia lub klucz z catalog:read. Podany błędny klucz nie jest pomijany.
  /availability:
    get:
      summary: Sprawdź pokoje i cenę pobytu
      operationId: getAvailability
      tags:
        - Oferta
      security:
        - {}
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvailableRoom'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                required:
                  - items
                  - total
                  - page
                  - pageSize
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - name: checkIn
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: checkOut
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: guests
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 30
        - name: packageId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      description: Przedział pobytu [przyjazd, wyjazd). Dla klucza partnera wymagane catalog:read.
  /reservations:
    post:
      summary: Utwórz pobyt
      operationId: postReservations
      tags:
        - Pobyty
      security:
        - CookieAuth: []
          CsrfToken: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '200':
          description: Odtworzony wynik tej samej operacji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                  - 'true'
              description: Odpowiedź z wcześniejszego zapisu.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
            example:
              roomId: room-101
              checkIn: '2027-06-15'
              checkOut: '2027-06-17'
              guests: 1
              expectedTotalMinor: 48000
              guest:
                name: Anna Testowa
                email: anna@example.com
                phone: ''
              guestNames:
                - Anna Testowa
      x-required-scope: reservations:create
    get:
      summary: Lista dostępnych pobytów
      operationId: getReservations
      tags:
        - Pobyty
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                required:
                  - items
                  - total
                  - page
                  - pageSize
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - confirmed
              - checked_in
              - completed
              - cancelled
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      description: 'Klient/partner widzi tylko własne, recepcja/admin wszystkie. search: numer lub nazwa gościa.'
      x-required-scope: reservations:read
  /reservations/{id}:
    get:
      summary: Odczytaj pobyt
      operationId: getReservationsId
      tags:
        - Pobyty
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      x-required-scope: reservations:read
    patch:
      summary: Zmień daty i liczbę gości
      operationId: patchReservationsId
      tags:
        - Pobyty
      security:
        - CookieAuth: []
          CsrfToken: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
