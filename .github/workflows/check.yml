name: Sprawdzenie projektu

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Zachowaj raport testów przeglądarkowych
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raport-playwright
          path: playwright-report/
          retention-days: 14
